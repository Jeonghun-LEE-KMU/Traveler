name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Tests must remain offline with respect to application services.  Empty
    # values also prevent load_dotenv() from importing any real local secrets.
    env:
      OPENAI_API_KEY: ""
      PINECONE_API_KEY: ""
      KORSERVICE_API_KEY: ""
      KMA_API_KEY: ""
      WEATHER_API_KEY: ""
      TMAP_APP_KEY: ""
      NAVER_CLIENT_ID: ""
      NAVER_CLIENT_SECRET: ""
      DATABASE_URL: ""
      REDIS_URL: ""

    steps:
      # v7.0.1; full SHA pin keeps the action immutable.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # v7; Python 3.11 matches Dockerfile: python:3.11-slim.
      - name: Set up Python 3.11
        uses: actions/setup-python@751276eafca55f10f252026015f43c488f2322ba
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt

      - name: Install CI dependencies
        run: python -m pip install --requirement requirements-ci.txt

      - name: Compile Python sources
        run: python -m compileall -q main.py config.py traveler eval tests scripts

      - name: Run offline test suite
        run: python -m pytest -q
