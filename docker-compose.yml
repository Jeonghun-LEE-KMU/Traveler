# ============================================================
# TRAVELER 로컬 개발 환경
# Sprint 5: Redis 제거 → PostgreSQL 단일 저장으로 전환
#
# 실행: docker compose up -d
# 종료: docker compose down
# psql 접속: docker exec -it traveler-db psql -U postgres -d traveler
# ============================================================

version: '3.9'

services:
  db:
    image: postgres:15-alpine
    container_name: traveler-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: traveler
      POSTGRES_DB: traveler
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
